# ---------------------------------------------------------------------------
# Structured Logging Configuration
# ---------------------------------------------------------------------------
# Loaded via logging.config.dictConfig().  Supports both JSON (production)
# and console (development) formats. File rotation prevents unbounded growth.
# ---------------------------------------------------------------------------

version: 1
disable_existing_loggers: false

formatters:
  json:
    class: "pythonjsonlogger.json.JsonFormatter"
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S.%fZ"

  console:
    format: "[%(asctime)s] %(levelname)-8s %(name)-30s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  access:
    format: "%(asctime)s %(levelname)s %(name)s %(client_addr)s \"%(request_line)s\" %(status_code)s"

handlers:
  console:
    class: "logging.StreamHandler"
    level: "DEBUG"
    formatter: "console"
    stream: "ext://sys.stdout"

  file_app:
    class: "logging.handlers.RotatingFileHandler"
    level: "INFO"
    formatter: "json"
    filename: "logs/application.log"
    maxBytes: 10485760   # 10 MB
    backupCount: 10
    encoding: "utf-8"

  file_error:
    class: "logging.handlers.RotatingFileHandler"
    level: "WARNING"
    formatter: "json"
    filename: "logs/error.log"
    maxBytes: 10485760
    backupCount: 10
    encoding: "utf-8"

  file_access:
    class: "logging.handlers.RotatingFileHandler"
    level: "INFO"
    formatter: "access"
    filename: "logs/access.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: "utf-8"

loggers:

  # Root logger — catch-all at INFO
  root:
    level: "INFO"
    handlers: ["console", "file_app"]
    propagate: false

  # API server
  src.api:
    level: "INFO"
    handlers: ["console", "file_app"]
    propagate: false

  src.api.routers:
    level: "INFO"
    handlers: ["console", "file_app", "file_access"]
    propagate: false

  # Data pipeline
  src.data:
    level: "DEBUG"
    handlers: ["console", "file_app"]
    propagate: false

  # Feature engineering
  src.features:
    level: "INFO"
    handlers: ["console", "file_app"]
    propagate: false

  # Model training / inference
  src.models:
    level: "INFO"
    handlers: ["console", "file_app"]
    propagate: false

  src.training:
    level: "INFO"
    handlers: ["console", "file_app"]
    propagate: false

  # Monitoring & drift detection
  src.monitoring:
    level: "DEBUG"
    handlers: ["console", "file_app", "file_error"]
    propagate: false

  # Explainability
  src.explainability:
    level: "INFO"
    handlers: ["console", "file_app"]
    propagate: false

  # Utilities
  src.utils:
    level: "INFO"
    handlers: ["console", "file_app"]
    propagate: false

  # Third-party — suppress noisy libraries
  uvicorn:
    level: "WARNING"
    handlers: ["console"]
    propagate: false

  uvicorn.access:
    level: "WARNING"
    handlers: ["file_access"]
    propagate: false

  uvicorn.error:
    level: "INFO"
    handlers: ["file_error"]
    propagate: false

  sqlalchemy:
    level: "WARNING"
    handlers: ["console"]
    propagate: false

  sqlalchemy.engine:
    level: "WARNING"
    handlers: ["file_error"]
    propagate: false

  mlflow:
    level: "WARNING"
    handlers: ["console"]
    propagate: false

  evidently:
    level: "WARNING"
    handlers: ["console"]
    propagate: false

  redis:
    level: "WARNING"
    handlers: ["console"]
    propagate: false

  httpx:
    level: "WARNING"
    handlers: ["console"]
    propagate: false

  watchfiles:
    level: "WARNING"
    handlers: ["console"]
    propagate: false
